name: kgka_music_hl
description: "the best music application"
publish_to: 'none'
version: 2026.10.07+20261007

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  audio_service: ^0.18.18
  audio_session: ^0.2.4
  http: ^1.5.0
  just_audio: ^0.10.4
  just_audio_windows: ^0.2.3
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  dio: ^5.7.0
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  file_picker: ^12.0.0
  flutter_lyric: ^3.0.7
  permission_handler: ^13.0.1
  lpinyin: ^2.0.3
  liquid_glass_easy: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# 本地 vendored fork：把卡拉OK高亮的库内置 200ms 补间去掉，改为按 setProgress 节流吸附，
# 让歌词层重栅格频率真正可控、字间隔 GPU idle，解决车机全屏播放时并发浮窗视频掉帧。
dependency_overrides:
  flutter_lyric:
    path: third_party/flutter_lyric

flutter:
  uses-material-design: true
  assets:
    - update.md
    - lib/assets/logo.png
