name: Build Android APK

# 触发条件：
#   1. 推送到 master 或 main 分支时自动构建
#   2. 推送 v* 标签时构建并自动发布 GitHub Release
#   3. 可在 Actions 页面手动触发 (workflow_dispatch)
on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-apk:
    name: Build Android APK (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # lib/assets/logo.png 是 Git LFS 跟踪文件，需真实图片用于资源打包
          lfs: true

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      - name: Install dependencies
        run: flutter pub get

      # 若仓库配置了发布签名 secrets，则解密生成 android/key.properties（gitignore 不入库），
      # 使每次 CI 构建使用同一固定 release 签名，产物间可互相覆盖安装；
      # 未配置 secrets 时保持原行为：回退 debug 签名。
      - name: Setup release signing
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$GITHUB_WORKSPACE/android/release-keystore.p12"
            echo "storeFile=release-keystore.p12" > "$GITHUB_WORKSPACE/android/key.properties"
            echo "storePassword=$KS_PASS" >> "$GITHUB_WORKSPACE/android/key.properties"
            echo "keyAlias=$KS_ALIAS" >> "$GITHUB_WORKSPACE/android/key.properties"
            echo "keyPassword=$KS_PASS" >> "$GITHUB_WORKSPACE/android/key.properties"
            echo "Release signing configured (alias=$KS_ALIAS)"
          else
            echo "No release signing secrets; fallback to debug signing"
          fi

      # release 构建：仓库未配置 android/key.properties（已被 .gitignore 忽略），
      # build.gradle.kts 会自动回退使用 debug 签名，产物可直接安装。
      # JitPack 的 SuperLyricApi 是"首次请求时才懒构建"，冷启动可能 404 或极慢，
      # 第一次失败后 sleep 90s 重试一次，让 JitPack 完成远程构建。
      - name: Build APK (release)
        run: |
          flutter build apk --release || {
            echo "⚠️ 首次构建失败（可能为 JitPack 懒构建中），等待 90s 后重试…"
            sleep 90
            flutter build apk --release
          }

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk
          else
            echo "apksigner not found, skip"
          fi

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kgka-music-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: KA Music ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}